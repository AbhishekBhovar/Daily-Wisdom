#dayFlash{position:absolute;z-index:6;top:4px;left:50%;transform:translate(-50%,-8px);padding:6px 10px;border:1px solid rgba(173,156,255,.28);border-radius:999px;background:rgba(8,8,18,.9);color:var(--violet-bright);font-size:9px;letter-spacing:1.5px;opacity:0;pointer-events:none;white-space:nowrap}#dayFlash.show{animation:dayFlash .72s ease}@keyframes dayFlash{0%{opacity:0;transform:translate(-50%,-8px)}18%,72%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,4px)}}
.weekLink{display:block;margin:2px auto 14px;padding:8px 12px;color:var(--violet-bright);font-size:9px;letter-spacing:1.5px;border:1px solid rgba(173,156,255,.30);border-radius:999px}

.app{background:radial-gradient(ellipse at 50% -8%,rgba(20,83,177,.44),transparent 36%),radial-gradient(circle at 12% 12%,rgba(31,89,180,.14),transparent 22%),linear-gradient(180deg,#071127 0%,#050b18 45%,#030711 100%)}

.bookMark{stroke:#d9e5ff}.headerTitle small,.source b{color:var(--violet-bright)}
.screen{height:calc(100dvh - 174px - 116px)}
.wisdomCard{justify-content:flex-start;padding-top:2vh;overflow:auto;scrollbar-width:none}.wisdomCard::-webkit-scrollbar{display:none}

.libitem p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.empty{text-align:center;color:#7e879c;margin-top:40px}

/* Prototype R2 — readability pass */
.fullQuote{
  max-width:360px;

  font-size:clamp(18px,4.8vw,24px);
  line-height:1.52;
  letter-spacing:.002em;
  text-wrap:pretty;
  font-weight:400;
}
.fullQuote .focus{color:#b7ccff;font-weight:400;text-transform:none;text-shadow:0 0 12px rgba(90,143,255,.16)}
.source em{display:none}
@media(max-height:760px){.fullQuote{font-size:clamp(17px,4.35vw,21px);line-height:1.46}}

/* Prototype R3 — quote typography matches speaker; emphasis is colour only */

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400;
  letter-spacing:.005em;
}

  color:#b7ccff;
  font-family:inherit;
  font-size:inherit;
  font-weight:inherit;
  letter-spacing:inherit;
  text-transform:none;
}


/* Prototype R4 — uniform quote treatment + dialogue spacing */
.fullQuote{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;
  font-weight:400 !important;
  color:var(--cream) !important;
  text-shadow:none;
  text-wrap:pretty;
}
.fullQuote .focus, .fullQuote .surround{
  color:inherit !important;
  font:inherit !important;
  letter-spacing:inherit !important;
  text-transform:none !important;
  text-shadow:none !important;
}
.quoteBlock{
  margin:0;
  padding:0;
  color:inherit;
  font:inherit;
}
.quoteBlock + .quoteBlock{
  margin-top:.72em;
}

/* Prototype R5 — hard reset: quote typography exactly follows speaker family; no emphasis styling */
.fullQuote,
.fullQuote *,
.quoteBlock {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  font-weight: 400 !important;
  font-style: normal !important;
  text-transform: none !important;
  color: var(--cream) !important;
  text-shadow: none !important;
  letter-spacing: .005em !important;
}
.fullQuote { line-height: 1.48 !important; }
.fullQuote .focus, .fullQuote .surround { color: var(--cream) !important; }
.quoteBlock { margin: 0 !important; }
.quoteBlock + .quoteBlock { margin-top: .9em !important; }
.source b {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
}

#fullQuote *,

.source b {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
}
#fullQuote,
#fullQuote *,
#fullQuote .quoteBlock {

.source b {

/* V1.0.4 — once-per-day celestial loading ritual */
#dailyIntro{
  position:fixed; inset:0; z-index:99999;
  background:
    radial-gradient(circle at 50% 46%, rgba(52,112,255,.16), transparent 30%),
    linear-gradient(180deg,#020817 0%,#030b1d 58%,#020713 100%);
  overflow:hidden;
  opacity:1;
  transition:opacity .7s ease;
  touch-action:manipulation;
}
#dailyIntro.introHide{opacity:0;pointer-events:none}
#dailyIntro .introNebula{
  position:absolute; inset:-15%;
  background:
    radial-gradient(ellipse at 22% 42%,rgba(58,104,255,.13),transparent 31%),
    radial-gradient(ellipse at 80% 62%,rgba(121,88,255,.10),transparent 30%),
    radial-gradient(ellipse at 53% 50%,rgba(107,175,255,.09),transparent 25%);
  filter:blur(22px);
  opacity:0;
  animation:introNebula 5s ease forwards;
}
#dailyIntro .introStar{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#dce9ff;
  box-shadow:0 0 6px rgba(184,213,255,.8);
  opacity:0;
  animation:introTwinkle 3.8s ease forwards;
}
#dailyIntro .introCore{
  position:absolute;left:50%;top:48%;width:3px;height:3px;
  transform:translate(-50%,-50%);
  border-radius:50%;background:#fff;
  box-shadow:0 0 8px #fff,0 0 18px #88b8ff,0 0 38px #5b8fff;
  opacity:0;
  animation:introCore 5s ease forwards;
}
#dailyIntro .introCore:before,
#dailyIntro .introCore:after{
  content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:linear-gradient(90deg,transparent,#cfe2ff,transparent);
  opacity:0;
  animation:introRays 5s ease forwards;
}
#dailyIntro .introCore:before{width:150px;height:1px}
#dailyIntro .introCore:after{width:1px;height:150px;background:linear-gradient(180deg,transparent,#cfe2ff,transparent)}
#dailyIntro .introHint{
  position:absolute;left:50%;bottom:8.5%;
  transform:translateX(-50%);
  color:rgba(210,224,255,.42);
  font:500 11px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  letter-spacing:.22em;text-transform:uppercase;
  opacity:0;animation:introHint 5s ease forwards;
}
@keyframes introNebula{
  0%,12%{opacity:0;transform:scale(.96)}
  48%{opacity:.7}
  82%{opacity:.9;transform:scale(1.03)}
  100%{opacity:0;transform:scale(1.05)}
}
@keyframes introTwinkle{
  0%{opacity:0;transform:scale(.4)}
  35%{opacity:.25}
  58%{opacity:.95;transform:scale(1)}
  85%{opacity:.6}
  100%{opacity:0}
}
@keyframes introCore{
  0%,36%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  58%{opacity:.55}
  73%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  89%{opacity:.9;transform:translate(-50%,-50%) scale(1.8)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(3)}
}
@keyframes introRays{
  0%,60%{opacity:0}
  74%{opacity:.65}
  92%{opacity:.35}

</script><script>const quotes=(window.DW_QUOTES||[]).filter(q=>q.quote);
const $=id=>document.getElementById(id);
const DAY=86400000;
const START_UTC=Date.UTC(2026,8,1); // 1 September 2026
const localDayUTC=(d=new Date())=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
const dayNumber=()=>Math.max(0,Math.floor((localDayUTC()-START_UTC)/DAY));
const dailyIndex=()=>quotes.length?Math.min(dayNumber(),quotes.length-1):0;
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let i=dailyIndex();
// Today is intentionally locked to the current calendar day. Historical/future swiping is disabled.
localStorage.removeItem('dwIndex');
let favs=new Set(JSON.parse(localStorage.dwFavs||'[]'));
let reflections=JSON.parse(localStorage.dwReflections||'{}');
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function quoteHtml(q){
  const raw=(q.quote||'').trim();
  // R6: q.highlight is deliberately ignored. The quote is rendered as stored,
  // in one font, one colour and one weight.
  // Dialogue speaker labels start a new paragraph for readability.
  const normalized=raw.replace(/\s+(?=([A-Z][A-Za-z.'’ -]{1,35}:\s*))/g,'\n');
  const blocks=normalized.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  return blocks.map(block=>`<p class="quoteBlock">${esc(block)}</p>`).join('');
}
function dateForIndex(n){return new Date(START_UTC+n*DAY)}
function dateLabelForIndex(n){return dateForIndex(n).toLocaleDateString('en-AU',{timeZone:'UTC',month:'short',day:'numeric'}).toUpperCase()}
function save(){localStorage.dwFavs=JSON.stringify([...favs]);localStorage.dwReflections=JSON.stringify(reflections)}
function reflectionKey(){return todayKey()+'::'+quotes[i].id}
function render(){if(!quotes.length)return;i=dailyIndex();const q=quotes[i];$('date').textContent=dateLabelForIndex(i);$('fullQuote').innerHTML=quoteHtml(q);$('who').textContent=/uncertain|paraphrase|tradition|ascribed/i.test(q.character||'')?'Unknown':q.character;$('fav').classList.toggle('active',favs.has(q.id));$('fav').querySelector('.navIcon').textContent=favs.has(q.id)?'♥':'♡';$('reflectionText').value=reflections[reflectionKey()]||'';save()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}
function page(p){document.querySelectorAll('.screen:not(.modal)').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.bottomnav [data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===p));if(p==='today'){i=dailyIndex();render()}if(p==='library')lib()}
// Day navigation removed: one calendar day = one Daily Wisdom quote.
$('fav').onclick=()=>{const id=quotes[i].id;favs.has(id)?favs.delete(id):favs.add(id);render();toast(favs.has(id)?'Added to favorites':'Removed from favorites')};
$('reflectionToggle').onclick=()=>$('reflectionBox').classList.toggle('open');
$('saveReflection').onclick=()=>{const v=$('reflectionText').value.trim();if(v)reflections[reflectionKey()]=v;else delete reflections[reflectionKey()];save();toast('Reflection saved')};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));
function lib(filter='all'){let h='';const unlocked=dailyIndex();quotes.forEach((q,n)=>{if(n>unlocked)return;if(filter==='favs'&&!favs.has(q.id))return;h+=`<div class="libitem" data-n="${n}"><span class="d">${esc(q.world)}</span><p>${esc(q.quote).replace(/\n/g,' ')}</p><small>${esc(q.character||'Unknown')}</small>${favs.has(q.id)?'<span class="heart">♥</span>':''}</div>`});$('libraryList').innerHTML=h||'<p class="empty">No favorites yet.</p>'}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');lib(t.dataset.tab)});
// Swipe navigation removed. Vertical scrolling remains normal.
$('quoteCount').textContent=quotes.length;
render();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
if('caches' in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));}
</script>

<script>
(function(){
  const intro=document.getElementById('dailyIntro');
  if(!intro) return;

  function removeIntro(){
    if(!intro || intro.dataset.done==='1') return;
    intro.dataset.done='1';
    intro.classList.add('introHide');
    setTimeout(()=>intro.remove(),750);
  }

  // Invisible-book intro plays on every app/page load. Tap anywhere to skip immediately.
  intro.addEventListener('click',removeIntro,{once:true});
  intro.addEventListener('touchstart',removeIntro,{once:true,passive:true});
  setTimeout(removeIntro,4350);
})();
</script>


<script>
(function(){
  const intro=document.getElementById('dailyIntro');
  const spark=intro && intro.querySelector('.penSpark');
  if(!intro || !spark) return;

  const segments=[
    {id:'write1',start:420,dur:920},
    {id:'write2',start:1480,dur:900}
  ];
  const svg=intro.querySelector('.writingCanvas');
  let started=null, raf=0;

  function placeSpark(path,progress){
    const len=path.getTotalLength();
    const pt=path.getPointAtLength(len*Math.max(0,Math.min(1,progress)));
    const svgPt=svg.createSVGPoint(); svgPt.x=pt.x; svgPt.y=pt.y;
    const screenPt=svgPt.matrixTransform(svg.getScreenCTM());
    spark.style.left=screenPt.x+'px';
    spark.style.top=screenPt.y+'px';
  }

  function tick(ts){
    if(!started) started=ts;
    const t=ts-started;
    let active=false;
    for(const seg of segments){
      if(t>=seg.start && t<=seg.start+seg.dur){
        const path=document.getElementById(seg.id);
        if(path){
          placeSpark(path,(t-seg.start)/seg.dur);
          spark.style.opacity='1';
          active=true;
        }
        break;
      }
    }
    if(!active) spark.style.opacity='0';
    if(t<3350 && document.body.contains(intro)) raf=requestAnimationFrame(tick);
  }
  spark.style.animation='none';
  raf=requestAnimationFrame(tick);
})();
</script>
